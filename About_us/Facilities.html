<!DOCTYPE html>
<html lang="en">
<script>
    fetch("/assets/head.html")
        .then((response) => response.text())
        .then((data) => (document.head.innerHTML = data));
</script>

<body>
    <div id="navigation"></div>

    <!-- main -->
    <main>
        <div class="container">
            <h2 class="gallery-title">Facilities</h2>

            <!-- Swiper -->
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <!-- Slides -->
                    <div class="swiper-slide">
                        <img src="/assets/img/placeholder2.webp" alt="Image 1" />
                    </div>
                    <div class="swiper-slide">
                        <img src="/assets/img/placeholder2.webp" alt="Image 2" />
                    </div>
                    <div class="swiper-slide">
                        <img src="/assets/img/placeholder2.webp" alt="Image 3" />
                    </div>
                    <div class="swiper-slide">
                        <img src="/assets/img/placeholder2.webp" alt="Image 4" />
                    </div>
                    <div class="swiper-slide">
                        <img src="/assets/img/placeholder2.webp" alt="Image 5" />
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
        </div>
    </main>

    <!-- footer -->
    <div id="footer"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/assets/js/functions.js"></script>
    <script>
        function loadHTML(id, file) {
            fetch(file)
                .then((response) => response.text())
                .then((data) => (document.getElementById(id).innerHTML = data));
        }
        loadHTML("navigation", "/assets/navigation.html");
        loadHTML("footer", "/assets/footer.html");
    </script>
</body>

</html>
