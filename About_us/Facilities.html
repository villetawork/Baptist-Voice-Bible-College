<!DOCTYPE html>
<html lang="en">
  <script>
    fetch("/assets/head.html")
      .then((response) => response.text())
      .then((data) => (document.head.innerHTML = data));
  </script>

  <body>
    <div id="loading-screen" class="loading-screen" style="display: none">
      <div class="logo-container">
        <img id="loader-logo" src="/assets/img/logo/Logo.png" alt="Logo" />
      </div>
    </div>

    <!-- Main Content -->
    <div id="main-content" style="display: none">
      <div id="navigation"></div>

      <!-- main -->
      <main>
        <div class="container mt-5 p-3">
          <h2 class="gallery-title p-3">FACILITIES</h2>

          <!-- Swiper -->
          <div class="swiper mySwiper">
            <div class="swiper-wrapper"></div>

            <!-- Navigation buttons MUST be inside .swiper -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
          </div>
        </div>
      </main>

      <!-- footer -->
      <div id="footer"></div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="/assets/js/functions.js"></script>
    <script>
      function loadHTML(id, file) {
        fetch(file)
          .then((response) => response.text())
          .then((data) => (document.getElementById(id).innerHTML = data));
      }
      loadHTML("navigation", "/assets/navigation.html");
      loadHTML("footer", "/assets/footer.html");
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const imageSources = [
          "/assets/img/facilities/1.png",
          "/assets/img/facilities/2.jpg",
          "/assets/img/facilities/3.jpg",
          "/assets/img/facilities/4.png",
          "/assets/img/facilities/5.png",
          "/assets/img/facilities/6.jpg",
          "/assets/img/facilities/7.png",
          "/assets/img/facilities/8.png",
          "/assets/img/facilities/9.png",
          "/assets/img/facilities/10.png",
          "/assets/img/facilities/11.jpg",
          "/assets/img/facilities/12.jpg",
          "/assets/img/facilities/13.jpg",
          "/assets/img/facilities/14.jpg",
          "/assets/img/facilities/15.jpg",
          "/assets/img/facilities/16.jpg",
          "/assets/img/facilities/17.jpg",
          "/assets/img/facilities/18.jpg",
          "/assets/img/facilities/19.jpg",
          "/assets/img/facilities/20.jpg",
        ];

        const swiperWrapper = document.querySelector(".swiper-wrapper");

        imageSources.forEach((src, index) => {
          const slide = document.createElement("div");
          slide.className = "swiper-slide";
          slide.innerHTML = `<img src="${src}" alt="Image ${index + 1}" />`;
          swiperWrapper.appendChild(slide);
        });

        // Now initialize Swiper after slides are added
        new Swiper(".mySwiper", {
          slidesPerView: 1,
          spaceBetween: 20,
          loop: true,
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
          breakpoints: {
            576: { slidesPerView: 1 },
            768: { slidesPerView: 2 },
            992: { slidesPerView: 3 },
          },
        });
      });
    </script>
  </body>
</html>
