<!DOCTYPE html>
<html lang="en">
<script>
  fetch("/assets/head.html")
    .then((response) => response.text())
    .then((data) => (document.head.innerHTML = data));
</script>

<body>
  <div id="navigation"></div>

  <!-- main -->
  <main class="calendar">

    <div class="container py-4">
      <div class="row">
        <div class="col-12 col-md-7 order-md-2" id="calendarSection">
          <div class="mb-3 calendar-header">
            <button class="btn btn-outline-secondary" onclick="changeMonth(-1)">&#8592;</button>
            <h4 id="monthYear" class="mb-0"></h4>
            <button class="btn btn-outline-secondary" onclick="changeMonth(1)">&#8594;</button>
          </div>
          <div id="calendarContainer" class="d-flex flex-wrap"></div>
        </div>
        <div class="col-12 col-md-5 order-md-1 mt-3">
          <div class="mb-3 event-header">
            <h5 class="mb-0">Event List</h5>
            <select id="filterSelect" class="form-select w-auto" onchange="renderCalendar()">
              <option value="All">All Events</option>
              <option value="BasicED">BasicED</option>
              <option value="College">College</option>
            </select>
          </div>
          <ul class="list-group" id="eventList"></ul>
        </div>
      </div>
    </div>

    <script>
      const calendarContainer = document.getElementById('calendarContainer');
      const eventList = document.getElementById('eventList');
      const monthYear = document.getElementById('monthYear');
      const filterSelect = document.getElementById('filterSelect');

      //insert event (YYYY-MM-DD)
      const events = [
        //august (this month)
        { title: 'PTC', type: 'BasicED', startDate: '2025-08-08', endDate: '2025-08-08' },
        { title: '1st Quarter <br>Exam', type: 'BasicED', startDate: '2025-08-11', endDate: '2025-08-12' },
        { title: 'Educators <br>Convention', type: 'BasicED', startDate: '2025-08-14', endDate: '2025-08-15' },
        { title: 'Quarter Break <br> Acting Workshop', type: 'BasicED', startDate: '2025-08-18', endDate: '2025-08-22' },
        { title: '3rd Tri-Weekly <br> BVBC Night', type: 'BasicED', startDate: '2025-08-26', endDate: '2025-08-26' },
        { title: 'Linggo ng Wika', type: 'BasicED', startDate: '2025-08-29', endDate: '2025-08-29' },
        { title: 'Midterm College <br>Exam', type: 'College', startDate: '2025-08-04', endDate: '2025-08-08' },
        // September (next month)
        { title: 'PTC', type: 'BasicED', startDate: '2025-09-05', endDate: '2025-09-05' },
        { title: '1st Tri-Weekly', type: 'BasicED', startDate: '2025-09-15', endDate: '2025-09-15' },
        { title: 'Academic Week', type: 'BasicED', startDate: '2025-09-22', endDate: '2025-09-26' },
        { title: "Teachers' Appriciation", type: 'BasicED', startDate: '2025-09-29', endDate: '2025-10-03' },
        { title: 'Final Exam<br> College', type: 'College', startDate: '2025-09-08', endDate: '2025-09-12' },
        { title: 'Clearance & <br> Submission of Grades', type: 'College', startDate: '2025-09-15', endDate: '2025-09-19' },
        { title: 'School Camp', type: 'College', startDate: '2025-09-15', endDate: '2025-09-16' },
      ];

      let currentDate = new Date();

      function renderCalendar() {
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        monthYear.textContent = currentDate.toLocaleString('default', { month: 'long', year: 'numeric' });
        calendarContainer.innerHTML = '';

        const dayLabels = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        dayLabels.forEach(day => {
          const label = document.createElement('div');
          label.className = 'calendar-day day-label bg-light d-flex';
          label.textContent = day;
          calendarContainer.appendChild(label);
        });

        const filteredEvents = events.filter(event => {
          const eventStart = new Date(event.startDate);
          const eventEnd = new Date(event.endDate);
          return (eventStart.getFullYear() === year && eventStart.getMonth() === month) ||
            (eventEnd.getFullYear() === year && eventEnd.getMonth() === month) ||
            (eventStart < new Date(year, month + 1, 1) && eventEnd >= new Date(year, month, 1));
        }).filter(event => filterSelect.value === 'All' || event.type === filterSelect.value);

        for (let i = 0; i < firstDay; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'calendar-day';
          calendarContainer.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
          const hasEvent = filteredEvents.some(e => dateStr >= e.startDate && dateStr <= e.endDate);
          const dayCell = document.createElement('div');
          dayCell.className = `calendar-day ${hasEvent ? 'has-event' : ''}`;
          dayCell.textContent = day;
          calendarContainer.appendChild(dayCell);
        }

        renderEventList(filteredEvents);
      }

      function renderEventList(filteredEvents) {
        eventList.innerHTML = '';
        if (filteredEvents.length === 0) {
          eventList.innerHTML = '<li class="list-group-item">No events this month.</li>';
        } else {
          filteredEvents.sort((a, b) => new Date(a.startDate) - new Date(b.startDate));
          filteredEvents.forEach(event => {
            const start = new Date(event.startDate);
            const end = new Date(event.endDate);

            const startDate = `<span class="event-date">${start.getDate()}</span> <span class="event-month">${start.toLocaleString('default', { month: 'short' })}</span>`;
            const endDate = `<span class="event-date">${end.getDate()}</span> <span class="event-month">${end.toLocaleString('default', { month: 'short' })}</span>`;

            const dateDisplay = (event.startDate === event.endDate)
              ? `${startDate}`
              : `${startDate}<br>${endDate}`;

            eventList.innerHTML += `
            <li class="list-group-item event-list-item">
              <div class="event-list-top">
                <strong>${event.title}</strong>
                <span class="text-end">${dateDisplay}</span>
              </div>
              <span class="event-type-${event.type}">${event.type}</span>
            </li>`;
          });
        }
      }

      function changeMonth(offset) {
        currentDate.setMonth(currentDate.getMonth() + offset);
        renderCalendar();
      }

      renderCalendar();
    </script>
  </main>

  <!-- footer -->
  <div id="footer"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script>
    function loadHTML(id, file) {
      fetch(file)
        .then((response) => response.text())
